version: "3.8"

x-common-node-variables: &common-node-variables
  NODE_ENV: production

services:
  # -------------------------------------------------------------------------
  postgres.db.riptest:
    container_name: postgres.db.riptest
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: riptest
    volumes:
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - 5432:5432
    networks:
      - local-network
  # -------------------------------------------------------------------------
  user.service.riptest:
    container_name: user.service.riptest
    build:
      context: ./services/user
      dockerfile: production.Dockerfile
    volumes:
      - ./services/user/src:/usr/src/app/src
      - ./services/user/.env:/usr/src/app/.env
      - ./services/user/migrations:/usr/src/app/migrations
      - ./services/user/schema.prisma:/usr/src/app/schema.prisma
    environment:
      <<: *common-node-variables
    depends_on:
      - postgres.db.riptest
    ports:
      - 8282:8282
    networks:
      - local-network
  # -------------------------------------------------------------------------
  security.service.riptest:
    container_name: security.service.riptest
    build:
      context: ./services/security
      dockerfile: production.Dockerfile
    volumes:
      - ./services/security/src:/usr/src/app/src
    environment:
      <<: *common-node-variables
    ports:
      - 8181:8181
    networks:
      - local-network
  # -------------------------------------------------------------------------
  user.gateway.riptest:
    container_name: user.gateway.riptest
    build:
      context: ./services/gateways/user
      dockerfile: production.Dockerfile
    volumes:
      - ./services/gateways/user/src:/usr/src/app/src
    environment:
      <<: *common-node-variables
    ports:
      - 80:80
      - 443:443
    networks:
      - local-network
      - gateway-network
  # -------------------------------------------------------------------------

networks:
  local-network:
    name: local-network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 176.25.25.0/16

  gateway-network:
    name: gateway-network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.25.25.0/16
